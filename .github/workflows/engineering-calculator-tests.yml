name: Engineering calculator tests

on:
  push:
    paths:
      - "engineering-tools/**"
      - "projects/**"
      - "index.html"
      - "tests/engineering-calculations.test.mjs"
      - ".github/workflows/engineering-calculator-tests.yml"
  pull_request:
    paths:
      - "engineering-tools/**"
      - "tests/engineering-calculations.test.mjs"
      - ".github/workflows/engineering-calculator-tests.yml"
  workflow_dispatch:

jobs:
  calculator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engineering calculator tests
        run: node --test tests/*.test.mjs
